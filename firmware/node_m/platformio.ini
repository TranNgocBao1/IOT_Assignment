; =============================================================================
; PlatformIO — Node M (YoloUNO ESP32-S3)
; Build:   pio run
; Nạp:     pio run -t upload
; Serial:  pio device monitor
; File .bin cho OTA nằm ở: .pio/build/yolo_uno/firmware.bin
; =============================================================================
[env:yolo_uno]
platform = espressif32
; TODO[M0-B]: đổi "board" theo tài liệu YoloUNO của môn học
; (nếu môn có file board riêng thì dùng tên đó, còn không thì esp32-s3-devkitc-1).
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bảng phân vùng có 2 slot OTA (app0, app1) — BẮT BUỘC cho T14.
board_build.partitions = partitions_ota.csv

build_flags =
    -I../common
    ; Tên và phiên bản firmware — phải KHỚP với gói OTA tạo trên CoreIOT.
    ; Khi build bản mới để OTA: tăng FW_VERSION (1.0.0 -> 1.0.1).
    -DFW_TITLE=\"air-node-m\"
    -DFW_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    ; TODO[M1-A]: kiểm tra tên thư viện đúng với cảm biến đang dùng
    ; (SCD40/SCD41: thư viện Sensirion I2C SCD4x).
    sensirion/Sensirion I2C SCD4x
